  ros__parameters:
    camera_name: "cam2"
    camera_info_url: ""
    resolution: [640, 512]
    format: "bgr8"
    frame_id: "cam2"

    compression:
      enable: true
      format: "h264"
      bitrate: 5000    # kbps
