# AutomatePro Driver Manager Configuration
# This file contains the default configuration parameters for the Driver Manager

# Node configuration
automatepro_driver_manager:
  ros__parameters:
    # Regex patterns to match driver node names
    # These patterns will be used to identify AutomatePro driver nodes to monitor
    # Note: ROS node names start with '/' so patterns must account for this
    driver_patterns:
      - "/automatepro_cam.*"         # Match all camera driver nodes starting with /automatepro_cam
      - "/automatepro_gnss.*"        # Match all GNSS driver nodes starting with /automatepro_gnss
      # Add more patterns as needed for other driver types
    
    # Discovery settings
    discovery_period: 5.0             # Period for discovering new driver nodes (seconds)
    
    # Monitoring settings  
    monitoring_period: 2.0            # Period for monitoring driver node states (seconds)
    
    # Recovery settings
    wait_time_gmsl2_restart: 5        # Wait time after triggering GMSL2 restart (seconds)
    
    # File system settings
    restart_file_base_path: "/opt/automatepro/ipc/"  # Base path for GMSL2 restart files
    
    # Service call settings
    service_call_timeout: 500         # Timeout for ROS service calls (milliseconds)